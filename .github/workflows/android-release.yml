name: Build and release Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truyenplus-android-release
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'phanan04/truyenplus' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      active: ${{ steps.version.outputs.active }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Plan monotonic release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_release.py plan

  build-and-release:
    needs: plan
    if: needs.plan.outputs.active == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      TRUYENPLUS_CI: 'true'
      SKIP_TESTS: 'false'
      RELEASE_NAME: ${{ needs.plan.outputs.version_name }}
      RELEASE_CODE: ${{ needs.plan.outputs.version_code }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'androiddebugkey' }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'android' }}
      TRUYENPLUS_DRIVE_API_KEY: ${{ secrets.TRUYENPLUS_DRIVE_API_KEY }}
      BUILD_TOOLS_VERSION: '36.0.0'
      RUSTUP_TOOLCHAIN: '1.89.0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test release integrity and retry guards
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Verify original key and apply CI version
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          export KEYSTORE_FILE="$RUNNER_TEMP/truyenplus-signing.jks"
          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          python3 scripts/ci_release.py prepare --name "$RELEASE_NAME" --code "$RELEASE_CODE"
      - name: Install Android SDK and native compiler
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;$BUILD_TOOLS_VERSION" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi,i686-linux-android
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            native/build/vieneu/*/verified-build
            android/src/main/jniLibs
          key: vieneu-${{ runner.os }}-ndk28.2-rust1.89-${{ hashFiles('native/vieneu/**', 'scripts/build-vieneu-native.py') }}
      - name: Build and test installable app
        run: |
          bash .github/scripts/SetupClUnix.sh
          chmod +x gradlew
          xvfb-run -a ./gradlew --no-daemon --no-configuration-cache --max-workers=2 --no-parallel -PtruyenplusQa=false :presentation:desktopTest :android:assembleStandardDebug
      - name: Verify APK and generate update metadata
        run: python3 scripts/ci_release.py package --name "$RELEASE_NAME" --code "$RELEASE_CODE" --tools "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TruyenPlus-${{ needs.plan.outputs.version_name }}
          path: dist/ci/
          if-no-files-found: error
          retention-days: 7
      - name: Publish verified release and check public updater
        run: python3 scripts/ci_release.py publish --name "$RELEASE_NAME"
      - name: Remove signing material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/truyenplus-signing.jks" "$RUNNER_TEMP/truyenplus-signing.certificate.der"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            presentation/build/test-results/desktopTest/
            presentation/build/reports/tests/desktopTest/
          if-no-files-found: ignore
          retention-days: 7
